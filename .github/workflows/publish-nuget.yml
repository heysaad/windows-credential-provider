name: Build and publish NuGet

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated package to NuGet.org
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Test Windows x64
        run: dotnet test src/Lithnet.CredentialProvider.UnitTests.x64 -c Release --arch x64
      - name: Pack
        run: dotnet pack src/Lithnet.CredentialProvider -c Release -o artifacts/packages -p:ContinuousIntegrationBuild=true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nuget-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
      - name: Publish to NuGet.org
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw 'Add the NUGET_API_KEY repository secret before publishing.'
          }
          Get-ChildItem artifacts/packages/*.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
            if ($LASTEXITCODE -ne 0) { throw 'NuGet publication failed.' }
          }
